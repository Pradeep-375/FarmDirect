apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: farmdirect }
            - { name: MYSQL_USER, value: farmdirect }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: farmdirect-secrets, key: MYSQL_ROOT_PASSWORD } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: farmdirect-secrets, key: MYSQL_PASSWORD } } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          readinessProbe: { exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
